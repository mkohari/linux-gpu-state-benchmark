[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-gpu-state-benchmark"
version = "0.2.0"
description = "Guided Linux GPU language and Monte Carlo state-reuse experiments"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Moiz Kohari"}]
dependencies = []

[project.optional-dependencies]
run = ["torch==2.9.0", "transformers==4.57.1", "safetensors==0.6.2"]

[project.scripts]
gpu-state-bench = "gpu_state_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
